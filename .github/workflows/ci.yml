name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check genie_engine/ genie_api/ genie_cli/ tests/

      - name: Type check (mypy)
        run: mypy genie_engine/ --ignore-missing-imports

      - name: Test
        env:
          APP_ENV: test
          LLM_PROVIDER: mock
        run: pytest tests/ -q --cov=genie_engine --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  rolepack-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate built-in RolePacks
        run: |
          genie pack validate rolepacks/code.rolepack.yaml
          genie pack validate rolepacks/pack.rolepack.yaml
      - name: Regression test code.rolepack
        env:
          LLM_PROVIDER: mock
        run: genie pack test rolepacks/code.rolepack.yaml
