[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genie-engine"
version = "0.1.0"
description = "Genie Engine - multi-agent orchestration engine"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [{name = "1406152161", email = "1406152161@qq.com"}]
keywords = ["ai", "agent", "orchestration"]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20", "click>=8.1", "httpx>=0.25", "fastapi>=0.109", "uvicorn>=0.27"]
[project.scripts]
genie = "genie_cli.main:main"


[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["genie_engine", "genie_cli", "genie_hub", "genie_api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
explicit_package_bases = true
python_version = "3.11"
ignore_missing_imports = true